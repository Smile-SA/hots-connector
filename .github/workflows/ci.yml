name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # HOTS release whose message-contract fixtures must match tests/contracts/fixtures/.
  HOTS_CONTRACT_REF: v2.1.0

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check hots_connector tests
      - run: python -m mypy hots_connector
      - run: python -m pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the wheel in a clean venv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install "$(ls dist/*.whl)[kafka,kubernetes]"
          /tmp/wheel-venv/bin/pip check
          test "$(/tmp/wheel-venv/bin/hots-connector --version)" = "hots-connector $(cat VERSION.txt)"

  contract-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fixtures match HOTS ${{ env.HOTS_CONTRACT_REF }}
        run: |
          for f in tests/contracts/fixtures/*.json; do
            curl -fsSL "https://raw.githubusercontent.com/Smile-SA/hots/${HOTS_CONTRACT_REF}/$f" -o /tmp/upstream.json
            cmp "$f" /tmp/upstream.json || { echo "::error file=$f::differs from HOTS ${HOTS_CONTRACT_REF}"; exit 1; }
          done
